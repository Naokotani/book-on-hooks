<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Books On Hooks Logo</title>
  <desc id="desc">Text logo for Books On Hooks with a small hook icon.</desc>

  <defs>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3e9d2" />
      <stop offset="100%" stop-color="#d9c7a1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1200" height="320" fill="none" />

  <g transform="translate(76,46)" fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <path d="M58 10 C92 10 116 34 116 68 C116 102 92 126 58 126" stroke-width="16"/>
    <path d="M58 126 L58 204 C58 232 76 248 100 248 C118 248 132 236 132 220 C132 204 120 192 104 192" stroke-width="16"/>
  </g>

  <text x="230" y="112" fill="url(#ink)" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="700" letter-spacing="2">
    BOOKS
  </text>
  <text x="230" y="188" fill="url(#ink)" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="3">
    ON
  </text>
  <text x="230" y="272" fill="url(#ink)" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="700" letter-spacing="2">
    HOOKS
  </text>
</svg>
